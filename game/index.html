<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Vault — a stealth game</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600" aria-label="Shadow Vault: sneak past the guards, grab the gems and reach the exit unseen"></canvas>
  <div id="bar">
    <span id="hud-level">LEVEL 1 — THE GALLERY</span>
    <span id="hud-alert">UNSEEN</span>
    <span id="hud-gems">GEMS 0/5</span>
    <span id="hud-score">SCORE 0</span>
    <span id="hud-time">0:00</span>
  </div>
  <p id="help">Move WASD / Arrows &middot; Hold SHIFT to run (loud!) &middot; Hold C to sneak (slow, silent) &middot; R restart &middot; 1/2/3 level &middot; M mute &middot; Click buttons with mouse</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
